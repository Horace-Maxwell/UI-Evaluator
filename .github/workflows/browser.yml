# The browser suite on Linux, run by hand from the Actions tab. It installs the pinned runtime, Chromium and CJK fonts.
name: browser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install the runtime packages
        run: npm install --prefix skills/ui-evaluator/scripts --no-audit --no-fund
      - name: Install Chromium and fonts
        run: |
          skills/ui-evaluator/scripts/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: npm run test:browser
