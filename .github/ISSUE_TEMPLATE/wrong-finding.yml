name: A finding is wrong
description: The audit or the lint reported something that is not a problem, missed one, or described it wrongly. These reports calibrate the detectors.
labels: [bug]
body:
  - type: input
    id: rule
    attributes:
      label: Rule
      description: The criterion ID in the finding, for example SLP-13 or A11Y-09.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      options:
        - It reported something that is not a problem (false positive)
        - It missed a problem it should have found (false negative)
        - The problem is real, but the message or the location is wrong
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: The page or the code
      description: A minimal HTML and CSS snippet, a public URL or a screenshot. Remove anything private first.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is wrong
      description: What the rule should have done here, with a source if you have one (WCAG, a design system, a study).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The plugin version, or the output of `node skills/ui-evaluator/scripts/uie.mjs --version`.
