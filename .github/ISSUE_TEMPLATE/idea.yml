name: An idea or a missing rule
description: A new rule, method or workflow change, with the evidence for it.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What goes wrong today, for whom, and how you noticed.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you suggest
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sources, measurements or examples. A gate, a threshold or a status changes only through a decision record in docs/framework/DECISIONS.md.
