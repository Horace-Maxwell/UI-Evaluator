name: Something does not work
description: A command fails or crashes, a workflow stops, or the skill does something its documents say it should not.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran or asked the agent, what you expected, and what you got. Paste commands and their output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The plugin version, or the output of `node skills/ui-evaluator/scripts/uie.mjs --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, the agent (Claude Code, Codex, Cursor and so on) and its model.
  - type: textarea
    id: doctor
    attributes:
      label: Output of `uie doctor`
      render: text
