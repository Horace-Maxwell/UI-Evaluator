<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>街道图书室 · 借阅与预约</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="canonical" href="https://library.example.org/new-york-street-branch">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">街道图书室</a>
    <nav aria-label="主导航">
      <a href="/catalogue" aria-current="page">馆藏目录</a>
      <a href="/events">活动</a>
      <a href="/account">我的借阅</a>
    </nav>
    <a href="/en" lang="en">English</a>
  </header>
  <main>
    <h1>借书、续借和预约，都可以在网上完成</h1>
    <p>输入读者证号即可查看借阅记录。每张读者证最多可同时借 10 本书，借期 30 天，可续借一次——续借需在到期前办理。</p>
    <form class="search" role="search">
      <label for="q">书名、作者或 ISBN</label>
      <input id="q" name="q" type="search" autocomplete="off" placeholder="例如：活着 余华">
      <button type="submit">搜索馆藏</button>
    </form>
    <section aria-labelledby="hours">
      <h2 id="hours">开放时间</h2>
      <table>
        <thead><tr><th scope="col">日期</th><th scope="col">时间</th></tr></thead>
        <tbody>
          <tr><td>周二至周五</td><td>9:00–20:00</td></tr>
          <tr><td>周六、周日</td><td>10:00–17:00</td></tr>
          <tr><td>周一</td><td>闭馆</td></tr>
        </tbody>
      </table>
    </section>
    <section aria-labelledby="notes">
      <h2 id="notes">借阅须知</h2>
      <ol>
        <li>首次借书请携带身份证办理读者证，办证免费。</li>
        <li>逾期每本每天收取 0.1 元滞纳金，最多不超过书价。</li>
        <li>预约的图书到馆后保留 7 天。</li>
      </ol>
    </section>
  </main>
  <footer>
    <p>地址：东城区和平里北街 12 号 · 电话：010-6421 0000</p>
  </footer>
</body>
</html>
