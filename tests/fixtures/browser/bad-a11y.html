<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accessibility defects</title>
<link rel="icon" href="data:,">
<style>
  body { font: 16px/1.5 sans-serif; margin: 0; color: #222; background: #fff; }
  header.sticky { position: sticky; top: 0; height: 120px; background: #fff; border-bottom: 1px solid #ccc; z-index: 10; }
  main { padding: 16px; }
  .faint { color: #aaaaaa; }
  .noring:focus { outline: none; }
  .tiny { width: 16px; height: 16px; padding: 0; margin: 0; border: 1px solid #333; background: #eee; font-size: 10px; line-height: 1; }
  .clicky { cursor: pointer; display: inline-block; padding: 8px; background: #eef; }
  .banner { background: #1a56c8; color: #fff; padding: 16px; }
  .banner .grey { color: #808080; }
  .ghostfield { border: 1px solid #e3e3e3; background: #fff; padding: 8px; font-size: 16px; }
  .iconbtn { background: none; border: 0; width: 44px; height: 44px; padding: 10px; }
  .iconbtn svg { width: 24px; height: 24px; }
  .paleRing:focus-visible { outline: 2px solid #f0f0f0; outline-offset: 2px; }
  .hero { background: linear-gradient(90deg, #ffffff, #ffe9c4); padding: 24px; }
  .hero p { color: #b0a090; font-size: 18px; }
</style>
</head>
<body>
  <header class="sticky"><a href="#main">Skip to content</a> <nav aria-label="Main"><a href="#a">Home</a> <a href="#b">Orders</a></nav></header>
  <main id="main">
    <h1>Accessibility defects</h1>
    <p class="faint">This paragraph uses a pale grey that fails contrast on white.</p>
    <div class="banner"><p>Banner text. <span class="grey">Grey meta text on blue.</span></p></div>
    <div class="hero"><p>Text over a gradient background that is too pale to read.</p></div>
    <form onsubmit="return false">
      <input class="ghostfield" type="email" placeholder="Email address">
      <button type="submit" class="noring">Subscribe</button>
    </form>
    <p>
      <button class="tiny" aria-label="Previous">‹</button><button class="tiny" aria-label="Next">›</button>
    </p>
    <div class="clicky" onclick="alert('hi')">Open details</div>
    <button class="iconbtn" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 12h16M12 4v16" stroke="#dddddd" stroke-width="2"/></svg></button>
    <a class="paleRing" href="#x">A link with a pale focus ring</a>
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" width="10" height="10">
    <div style="height: 1200px"></div>
    <a href="#top" id="bottom-link">Back to top</a>
  </main>
</body>
</html>
