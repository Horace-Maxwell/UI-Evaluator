<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout defects</title>
<link rel="icon" href="data:,">
<style>
  body { font: 16px/1.5 sans-serif; margin: 0; padding: 16px; color: #222; background: #fff; }
  .wide { width: 900px; height: 40px; background: #ddd; }
  .card { height: 48px; overflow: hidden; width: 260px; border: 1px solid #999; padding: 4px; }
  .tight { height: 26px; overflow: hidden; width: 170px; border: 1px solid #999; white-space: normal; }
  .remcard { height: 24px; overflow: hidden; width: 300px; border: 1px solid #999; font-size: 1rem; }
  .overlap-a { position: relative; }
  .overlap-b { position: absolute; top: 0; left: 0; }
</style>
</head>
<body>
  <main>
    <h1>Layout defects</h1>
    <div class="wide">A fixed 900 px block</div>
    <div class="card">This card has a fixed height and far too much text, so the third and fourth lines of this paragraph are clipped by overflow hidden.</div>
    <p>Spacing test below.</p>
    <div class="tight">Short line of text here</div>
    <div class="remcard">Rem text</div>
    <div class="overlap-a"><span>Overlapping words here</span><span class="overlap-b">Another label on top</span></div>
    <img src="missing-image.png" alt="A missing picture" width="40" height="40">
    <a href="nowhere.html">A broken link</a>
    <a href="#missing-anchor">A broken anchor</a>
    <script>console.error('boom: failed to init widget'); setTimeout(() => { throw new Error('late uncaught'); }, 0);</script>
  </main>
</body>
</html>
