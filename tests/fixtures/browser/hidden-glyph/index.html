<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>选班</title>
<style>
  body { margin: 0; padding: 24px; font: 20px/1.6 "PingFang SC", "Noto Sans SC", sans-serif; color: #222; background: #fbf6ec; }
  .option { display: block; border: 2px solid #6b625a; border-radius: 8px; padding: 16px; margin: 0 0 16px; background: #fffdf8; max-width: 520px; }
  .glyph { float: left; font-size: 56px; line-height: 1; width: 72px; height: 72px; margin: 0 16px 0 0; text-align: center; color: #c0392b; }
  .name { font-weight: 700; }
</style></head>
<body><main>
  <h1>选一个班</h1>
  <label class="option"><span class="glyph" aria-hidden="true">楷</span><input type="radio" name="c"> <span class="name">楷书入门</span><br>从头学起，适合刚开始练毛笔字</label>
</main></body></html>
