<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>语音导览 - 临川陶瓷博物馆</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead__inner">
      <a class="museum" href="index.html">临川陶瓷博物馆</a>
    </div>
  </header>

  <main class="page" id="main">
    <h1>语音导览</h1>
    <p class="lede">您可以输入展柜标签上的展品编号，收听或阅读这件展品的讲解。</p>

    <form class="search" id="search" role="search" aria-label="按编号查找展品">
      <div class="field">
        <label for="exhibit-number">展品编号</label>
        <input id="exhibit-number" name="number" type="text" inputmode="numeric" autocomplete="off">
      </div>
      <button class="button" type="submit">查找</button>
    </form>
    <p class="search-status" id="search-status" role="status"></p>

    <h2>二号展厅：宋元青白瓷</h2>
    <p class="lede">你也可以在下面的列表里选择展品。</p>
    <ul class="exhibits">
      <li>
        <a href="exhibit-12.html">12 号展品：青白瓷梅瓶</a>
        <span class="exhibit-meta">南宋，出土于临川城外</span>
      </li>
      <li>
        <span>13 号展品：青白瓷印花碗</span>
        <span class="exhibit-meta">北宋，文字讲解整理中</span>
      </li>
      <li>
        <span>14 号展品：褐釉执壶</span>
        <span class="exhibit-meta">元代，文字讲解整理中</span>
      </li>
      <li>
        <span>15 号展品：瓷枕残片</span>
        <span class="exhibit-meta">南宋，文字讲解整理中</span>
      </li>
    </ul>

    <section class="halls" aria-labelledby="halls-title">
      <h2 id="halls-title">其它展厅</h2>
      <ul>
        <li>一号展厅：窑址与工具</li>
        <li>三号展厅：明清民窑</li>
      </ul>
    </section>
  </main>

  <footer class="footer">
    <p>开放时间：周二至周日 9:00—17:00，周一闭馆。</p>
  </footer>

  <script src="guide.js"></script>
</body>
</html>
